name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov=mlproject --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train model for image
        run: |
          pip install -e .
          python -m mlproject.train
      - name: Build image
        run: docker build -t mlproject:ci .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name svc mlproject:ci
          sleep 5
          curl --fail http://localhost:8000/health
